<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prohlížeč zbraní</title>
    <style>
      :root { --bg: #6f716f; --panel: rgba(20, 18, 15, 0.86); --text: #eadfc8; --dim: #a99d86; --line: rgba(232, 214, 176, 0.18); }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 12px 'Segoe UI', Arial, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; left: 8px; top: 8px; background: var(--panel); border: 1px solid var(--line); padding: 10px; width: 250px; max-height: calc(100vh - 36px); overflow: auto; }
      #ui h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: 0.1em; }
      #ui label { display: flex; justify-content: space-between; gap: 6px; margin: 4px 0; align-items: center; }
      #ui select, #ui button { background: #2a251d; color: var(--text); border: 1px solid var(--line); padding: 3px 6px; font: inherit; }
      #ui button { margin: 2px 2px 0 0; cursor: pointer; }
      #stats { white-space: pre; font: 11px ui-monospace, Consolas, monospace; color: #d9f2c7; margin-top: 8px; }
      .note { color: var(--dim); margin-top: 6px; line-height: 1.4; }
      @media (max-width: 600px) { #ui { width: calc(100vw - 40px); } }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui">
      <h3>PROHLÍŽEČ ZBRANÍ</h3>
      <label>Zbraň <select id="weapon"></select></label>
      <label>Ruce <select id="hands"></select></label>
      <label>Kvalita <select id="q"><option value="low">Nízká</option><option value="standard" selected>Standardní</option><option value="high">Vysoká</option></select></label>
      <label>Světlo <select id="light"><option value="day">Neutrální den</option><option value="side">Ostré boční</option><option value="interior">Tmavší interiér</option></select></label>
      <label>Pohled <select id="view"><option value="hip">Hip (z očí)</option><option value="ads">ADS</option><option value="left">Levý bok</option><option value="right">Pravý bok</option><option value="top">Shora šikmo</option></select></label>
      <label>FOV (H, 16:9) <select id="fov"><option>80</option><option selected>90</option><option>110</option></select></label>
      <label>Body <input id="pts" type="checkbox" /></label>
      <div><button id="fire">Výstřel</button><button id="burst">Dávka</button><button id="reload">Přebití</button><button id="reloadE">Prázdné přebití</button><button id="swap">30× výměna</button></div>
      <div id="stats"></div>
      <div class="note">Vývojová pomůcka, ne herní menu úprav. Pevné konfigurace; ostatní zbraně arzenálu se doplňují postupně.</div>
    </div>
    <script type="module" src="/src/client/viewer.ts"></script>
  </body>
</html>
