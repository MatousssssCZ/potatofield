<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Potatofield</title>
    <link rel="stylesheet" href="/src/client/ui/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud" class="hidden">
      <div id="crosshair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div>
      <div id="stamina"><div class="bar"><div class="fill"></div></div></div>
      <div id="stance"></div>
    </div>
    <div id="dev" class="hidden"></div>
    <div id="loading">
      <div class="brand">POTATOFIELD</div>
      <div class="sub">pěchotní konflikt • technická střelnice</div>
      <div class="progress"><div class="fill"></div></div>
      <div class="status">Načítám…</div>
    </div>
    <div id="menu" class="hidden">
      <div class="panel">
        <div class="brand">POTATOFIELD</div>
        <div class="sub" id="menu-map"></div>
        <button id="btn-play" class="primary">Hrát</button>
        <button id="btn-settings">Nastavení</button>
        <button id="btn-controls">Ovládání</button>
        <div id="settings" class="hidden sect"></div>
        <div id="controls" class="hidden sect"></div>
        <div class="hint">Esc uvolní myš a otevře menu • F3 dev panel</div>
      </div>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
